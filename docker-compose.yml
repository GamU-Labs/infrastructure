services:
  nginx:
    image: nginx:1.31.1-alpine
    container_name: capstone-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    networks:
      - capstone-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/gamu-labs/backend-service:latest}
    container_name: capstone-backend
    restart: unless-stopped
    expose:
      - "8989"
    environment:
      - PORT=8989
    env_file:
      - ./backend.env
    volumes:
      - backend-data:/app/data
    networks:
      - capstone-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/gamu-labs/gamu-webapp:latest}
    container_name: capstone-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - capstone-network

volumes:
  backend-data:
  certbot-www:
  certbot-certs:

networks:
  capstone-network:
    driver: bridge
